---
name: Conformance

# Runs the client against a real Pelican federation, which is the only thing that can
# check this library's reading of the protocol against a server rather than against its
# own fake.
#
# The whole federation -- director, registry, origin and cache -- runs from one
# downloaded binary on a plain runner. Neither native backend starts XRootD:
# Origin.StorageType=posixv2 and Cache.EnableV2 both make serverLaunchesXrootd() false.
#
# The one thing this cannot cover is XRootD's own behavior, which differs from the
# native implementations in ways the client has to handle -- an XRootD cache answers
# PROPFIND on a collection with 409 where the Go cache answers 307, and it encodes
# crc32c as base64 where the registry says hex. That needs the pelican-dev image and is
# left for a follow-up.

env:
  # One place to bump. Pinned for reproducibility; the nightly leg floats the *image*
  # (and therefore XRootD) instead, which is where drift actually shows up.
  #
  # NOTE: 26.0.0-rc.0 is the earliest release in which a posixv2 origin starts without
  # XRootD installed (PelicanPlatform/pelican d8812204 "require the binary only for
  # servers that launch it"). Earlier releases cannot run tier 1 at all.
  PELICAN_VERSION: "26.0.0-rc.0"

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, so tier 2 catches upstream drift without gating every PR on it.
    - cron: "17 6 * * *"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # No federation: this leg must stay hermetic and offline, and fails if a test
      # quietly starts needing the network.
      - run: mvn --batch-mode verify

  federation:
    name: Conformance (origin + cache)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start a federation
        env:
          PELICAN_WITH_CACHE: "1"
        run: ci/start-federation.sh "${GITHUB_WORKSPACE}/federation.env"

      - name: Run conformance tests
        run: |
          set -a
          # shellcheck disable=SC1091
          . "${GITHUB_WORKSPACE}/federation.env"
          set +a
          mvn --batch-mode test -Dtest.excludedGroups= -Dgroups=federation

      - name: Federation log
        if: failure()
        run: tail -200 /tmp/pelican-fed/server.log

      - name: Stop the federation
        if: always()
        run: ci/stop-federation.sh
